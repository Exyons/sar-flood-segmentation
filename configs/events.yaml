# India flood events for GEE weak-label extraction.
#
# Each event defines either:
#   bbox    — single AOI as [min_lon, min_lat, max_lon, max_lat]
#   bboxes  — list of AOIs (preferred for river-corridor hotspot style)
# plus
#   s1_start / s1_end — Sentinel-1 search window (floodwater present)
#   s2_start / s2_end — Sentinel-2 weak-label window (overlap or bracket S1)

events:

  # Assam 2022 — Brahmaputra-corridor hotspots instead of full Assam bbox.
  # Five disjoint boxes over 2022 worst-hit districts. ~900 tiles total vs
  # ~10,800 for the full bbox, with far higher flood-pixel density per tile.
  assam2022:
    name: "Assam 2022 monsoon floods — Brahmaputra corridor hotspots"
    bboxes:
      - [89.7, 25.9, 90.8, 26.3]   # Dhubri–Goalpara (lower Brahmaputra)
      - [92.1, 26.1, 93.0, 26.6]   # Morigaon–Nagaon (Kopili confluence)
      - [92.7, 26.5, 93.6, 26.9]   # Kaziranga (floodplain)
      - [93.7, 26.7, 94.5, 27.1]   # Majuli–Jorhat (char belt)
      - [94.5, 27.2, 95.6, 27.7]   # Dibrugarh–Tinsukia (upper Brahmaputra)
    s1_start: "2022-06-15"
    s1_end:   "2022-07-20"
    s2_start: "2022-06-10"
    s2_end:   "2022-07-25"

  bihar2021:
    name: "Bihar 2021 monsoon floods"
    bbox: [83.0, 24.5, 88.5, 27.0]
    s1_start: "2021-07-20"
    s1_end:   "2021-08-25"
    s2_start: "2021-07-15"
    s2_end:   "2021-08-30"

  kerala2018:
    name: "Kerala 2018 floods"
    bbox: [74.5, 8.0, 77.5, 12.5]
    s1_start: "2018-08-10"
    s1_end:   "2018-08-25"
    s2_start: "2018-08-01"
    s2_end:   "2018-08-31"

  chennai2015:
    name: "Chennai 2015 floods"
    bbox: [79.8, 12.5, 80.5, 13.5]
    s1_start: "2015-11-25"
    s1_end:   "2015-12-15"
    s2_start: "2015-11-15"
    s2_end:   "2015-12-31"

# Export settings shared across events
export:
  scale_m: 10
  tile_size_px: 512
  drive_folder: "gee_exports"
  crs: "EPSG:4326"
  # Skip tiles whose weak label has fewer than this many flood pixels.
  # Saves Drive quota + training time on tiles with no real signal.
  # Set to 0 to export every tile.
  min_flood_px: 500
